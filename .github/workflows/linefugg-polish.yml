name: Apply LineFugg visual polish

on:
  push:
    branches: [main]
    paths:
      - 'ops/linefugg-polish/apply.py'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply deterministic patch
        run: python ops/linefugg-polish/apply.py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit polished LineFugg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/games/linefugg/LineFugg.tsx src/games/linefugg/LineFuggScene.ts src/games/linefugg/ASSET_MANIFEST.md docs/GAME_LAYOUT_SYSTEM.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: polish LineFugg orbital gameplay"
          git push
