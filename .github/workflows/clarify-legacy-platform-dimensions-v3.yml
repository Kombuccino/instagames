name: Clarify Legacy Platform Dimensions V3

on:
  push:
    branches:
      - core/dimension-contract-390x850-v3

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/clarify-legacy-platform-dimensions-v3.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run test:repository
      - run: npm run build
      - run: git diff --check
      - name: Commit clarifications
        run: |
          if git diff --quiet; then
            echo "No clarification changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DA_MAGAZINE.md docs/DA_UI.md docs/DA_WELCOME.md docs/PLATFORM_ENTRY_SCENES.md
          git commit -m "docs(layout): mark 390x844 platform rigs as legacy [dimension-legacy]"
          git push origin HEAD:core/dimension-contract-390x850-v3
