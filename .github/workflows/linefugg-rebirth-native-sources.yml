name: LineFugg Rebirth Native Sources

on:
  push:
    branches:
      - core/production-lab-native-sources

permissions:
  contents: write

jobs:
  build-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python scripts/build-linefugg-rebirth-sources.py
      - run: git diff --check
      - name: Commit generated native sources
        run: |
          if [ -z "$(git status --porcelain -- public/assets/generated/linefugg/rebirth/sources)" ]; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/generated/linefugg/rebirth/sources
          git commit -m "art(linefugg): add native Rebirth production sources [native-sources]"
          git push origin HEAD:core/production-lab-native-sources
