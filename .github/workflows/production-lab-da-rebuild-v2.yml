name: Production Lab DA Rebuild V2

on:
  push:
    branches:
      - core/production-lab-da-rebuild-v2

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-production-lab-da-rebuild-v2.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run test:repository
      - run: npm run build
      - run: git diff --check
      - name: Commit rebuilt DA plan
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/ProductionLab.tsx docs/PRODUCTION_LAB_V1.md docs/GAME_ART_PRODUCTION_PIPELINE.md src/games/linefugg/ASSET_MANIFEST.md src/games/linefugg/GAME_STATUS.md
          git commit -m "feat(lab): rebuild LineFugg DA production map [da-inventory-v2]"
          git push origin HEAD:core/production-lab-da-rebuild-v2
