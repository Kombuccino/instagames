name: LineFugg Rebirth Mini Slice

on:
  push:
    branches:
      - linefugg-rebirth-mini-slice

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-linefugg-rebirth-mini-slice.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run test:repository
      - run: npm run build
      - run: git diff --check
      - name: Commit mini-slice
        run: |
          if git diff --quiet; then
            echo "No mini-slice changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/games/linefugg/LineFugg.tsx src/games/linefugg/LineFuggScene.ts
          git commit -m "art(linefugg): add Lab-only Rebirth mini-slice [rebirth-mini-slice]"
          git push origin HEAD:linefugg-rebirth-mini-slice
