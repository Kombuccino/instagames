name: Temporary LineFugg runtime optimization

on:
  push:
    branches: [tmp-linefugg-runtime-opt-20260911]
    paths:
      - '.github/workflows/tmp-linefugg-runtime-opt.yml'

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir Pillow==11.3.0
      - name: Build compact lossless runtime textures
        run: |
          python - <<'PY'
          from __future__ import annotations
          from hashlib import sha256
          from pathlib import Path
          from PIL import Image
          import json

          jobs = [
              ('public/assets/generated/linefugg/ui/accounting-panels.png', 'public/assets/generated/linefugg/ui/runtime/accounting-panels.webp', 1024),
              ('public/assets/generated/linefugg/ui/glass-indicators.png', 'public/assets/generated/linefugg/ui/runtime/glass-indicators.webp', 1024),
              ('public/assets/generated/linefugg/ui/validate-amber-source.png', 'public/assets/generated/linefugg/ui/runtime/validate-amber-source.webp', 256),
          ]
          report = []
          for source_name, output_name, max_edge in jobs:
              source_path = Path(source_name)
              output_path = Path(output_name)
              output_path.parent.mkdir(parents=True, exist_ok=True)
              with Image.open(source_path) as source:
                  source.load()
                  ratio = min(1.0, max_edge / max(source.size))
                  size = (round(source.width * ratio), round(source.height * ratio))
                  target = source.convert('RGBA').resize(size, Image.Resampling.LANCZOS)
              target.save(output_path, 'WEBP', lossless=True, method=6, quality=100, exact=True)
              with Image.open(output_path) as decoded:
                  decoded.load()
                  decoded_rgba = decoded.convert('RGBA')
              if decoded_rgba.size != target.size:
                  raise SystemExit(f'dimension mismatch for {output_name}')
              alpha_equal = True
              visible_equal = True
              for expected, actual in zip(target.getdata(), decoded_rgba.getdata()):
                  if expected[3] != actual[3]:
                      alpha_equal = False
                      break
                  if expected[3] and expected != actual:
                      visible_equal = False
                      break
              if not alpha_equal or not visible_equal:
                  raise SystemExit(f'lossless visible-pixel verification failed for {output_name}')
              source_bytes = source_path.stat().st_size
              output_bytes = output_path.stat().st_size
              report.append({
                  'source': source_name,
                  'output': output_name,
                  'source_bytes': source_bytes,
                  'output_bytes': output_bytes,
                  'saving_percent': round((1 - output_bytes / source_bytes) * 100, 2),
                  'size': list(size),
                  'sha256': sha256(output_path.read_bytes()).hexdigest(),
                  'alpha_equal': alpha_equal,
                  'visible_pixels_equal': visible_equal,
              })
          print(json.dumps(report, indent=2))
          PY
      - name: Commit generated derivatives to temporary branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/generated/linefugg/ui/runtime/*.webp
          git diff --cached --check
          git commit -m 'assets(linefugg): generate compact runtime textures'
          git push origin HEAD:${GITHUB_REF_NAME}
