name: LineFugg mobile polish once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/linefugg-polish-once.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fit dynamic board to the real frame opening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/games/linefugg/LineFuggScene.ts')
          text = path.read_text()

          replacements = [
              (
                  "const BOARD_X = 10\nconst BOARD_Y = 144\nconst BOARD_SIZE = 370\n",
                  "const BOARD_X = 54\nconst BOARD_Y = 188\nconst BOARD_SIZE = 282\n",
              ),
              (
                  "  upperOrnament: ['linefugg-orbital-upper', `${ASSET_ROOT}/props/orbital-upper-ornament-v3.png`],\n",
                  "",
              ),
              (
                  "  private upperOrnament!: Phaser.GameObjects.Image\n",
                  "",
              ),
              (
                  "    const [upperKey] = ASSETS.upperOrnament\n    this.upperOrnament = this.add.image(195, 76, upperKey)\n      .setDisplaySize(320, 207)\n      .setAlpha(0.88)\n      .setDepth(2)\n\n    this.tweens.add({\n      targets: this.upperOrnament,\n      y: 80,\n      scaleX: this.upperOrnament.scaleX * 1.012,\n      scaleY: this.upperOrnament.scaleY * 1.012,\n      duration: 5200,\n      yoyo: true,\n      repeat: -1,\n      ease: 'Sine.easeInOut',\n    })\n\n",
                  "",
              ),
              (
                  "          fontSize: '22px',\n",
                  "          fontSize: '20px',\n",
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected LineFugg source fragment not found:\n{old}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          git diff --check

      - name: Build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit polish
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/games/linefugg/LineFuggScene.ts
          git commit -m 'fix(linefugg): fit board inside orbital frame'
          git push origin HEAD:main
