name: Frontend Build

on:
  pull_request:
  push:
    branches:
      - main
      - 'core/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Apply Production Lab event typing fix
        if: github.event_name == 'push' && github.ref_name == 'core/production-lab-static-graph'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/core/ProductionLab.tsx')
          text = path.read_text()
          old = 'function pointInElement(event: ReactPointerEvent<HTMLElement>) {'
          new = 'function pointInElement(event: { currentTarget: HTMLElement; clientX: number; clientY: number }) {'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/ProductionLab.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'fix(lab): accept click coordinates for semantic links [skip ci]'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - run: npm run test:repository
      - run: npm run build
