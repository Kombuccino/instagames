name: Production Lab DA Image Fix

on:
  push:
    branches:
      - core/production-lab-da-image-fix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-production-lab-da-image-fix.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run test:repository
      - run: npm run build
      - run: git diff --check
      - name: Commit DA image fix
        run: |
          if git diff --quiet; then
            echo "No DA image changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/ProductionLab.tsx
          git commit -m "fix(lab): refresh LineFugg DA image references [da-image-r2]"
          git push origin HEAD:core/production-lab-da-image-fix
