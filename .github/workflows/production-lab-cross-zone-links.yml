name: Production Lab Cross-Zone Links

on:
  push:
    branches:
      - core/production-lab-cross-zone-links

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-production-lab-cross-zone-links.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run test:repository
      - run: npm run build
      - run: git diff --check
      - name: Commit cross-zone link styling
        run: |
          if git diff --quiet; then
            echo "No cross-zone link changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/ProductionLab.tsx src/core/ProductionLab.css
          git commit -m "fix(lab): soften cross-zone semantic links [cross-zone-links]"
          git push origin HEAD:core/production-lab-cross-zone-links
