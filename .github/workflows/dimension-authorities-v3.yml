name: Dimension Authorities V3 Migration

on:
  push:
    branches:
      - core/dimension-contract-390x850-v3

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/migrate-dimension-authorities-v3.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run test:repository
      - run: npm run build
      - run: git diff --check
      - name: Commit authority migration
        run: |
          if git diff --quiet; then
            echo "No authority changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/GAME_CREATION_PIPELINE.md docs/GAME_ART_PRODUCTION_PIPELINE.md docs/GAME_MIGRATION_PLAN.md docs/PHASER_SKILLS.md docs/STYLE_SYSTEM.md docs/WELCOME_ART_STYLES.md docs/PLATFORM_VISUAL_VALIDATION.md docs/PLATFORM_REDESIGN.md .agents/skills/minifugg-art/SKILL.md src/core/StaticCoverArt.tsx
          git commit -m "docs(layout): migrate remaining dimension authorities [dimension-authorities]"
          git push origin HEAD:core/dimension-contract-390x850-v3
