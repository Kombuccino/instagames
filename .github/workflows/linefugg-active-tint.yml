name: LineFugg active tint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/linefugg-active-tint.yml'
      - 'ops/linefugg-active-tint/apply.py'

permissions:
  contents: write

concurrency:
  group: linefugg-active-tint
  cancel-in-progress: false

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply targeted correction
        run: python ops/linefugg-active-tint/apply.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: LineFugg smoke test
        run: |
          npm run dev -- --host 127.0.0.1 --port 5175 > /tmp/linefugg-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5175/ >/dev/null; then break; fi
            sleep 0.5
          done
          LINEFUGG_QUICK=1 node scripts/test-linefugg-browser.mjs
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/games/linefugg/LineFuggScene.ts src/core/gameRegistry.tsx src/games/linefugg/CHANGELOG.md src/games/linefugg/GAME_STATUS.md
          git diff --cached --check
          git commit -m "fix(linefugg): match active cell tint to line color"
          git fetch origin main
          git rebase origin/main
          npm run build
          git push origin HEAD:main
