name: Frontend Build

on:
  pull_request:
  push:
    branches:
      - main
      - 'core/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:repository
      - run: npm run build
      - name: Regenerate Production Lab LineFugg screens
        if: github.event_name == 'push' && github.ref_name == 'core/production-lab-review-ux'
        run: |
          npx playwright install chromium
          npm run dev -- --host 127.0.0.1 --port 5175 > /tmp/minifugg-vite.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5175/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/capture-production-lab-linefugg.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/generated/linefugg/production-lab/*.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(lab): refresh distinct LineFugg proof screens [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
