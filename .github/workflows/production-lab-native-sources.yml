name: Production Lab Native Sources

on:
  push:
    branches:
      - core/production-lab-native-sources

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-production-lab-native-sources.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run test:repository
      - run: npm run build
      - run: git diff --check
      - name: Commit Lab native-source pass
        run: |
          if git diff --quiet; then
            echo "No Lab changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/ProductionLab.tsx src/core/ProductionLab.css docs/PRODUCTION_LAB_V1.md src/games/linefugg/ASSET_MANIFEST.md src/games/linefugg/GAME_STATUS.md
          git commit -m "feat(lab): show native production sources [native-source-nodes]"
          git push origin HEAD:core/production-lab-native-sources
