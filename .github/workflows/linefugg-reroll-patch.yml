name: LineFugg reroll patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/linefugg-reroll-patch.yml'
      - 'ops/linefugg-reroll/apply.py'
      - 'ops/linefugg-reroll/fix_test.py'

permissions:
  contents: write

concurrency:
  group: linefugg-reroll-patch
  cancel-in-progress: false

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply targeted patch
        run: |
          python ops/linefugg-reroll/apply.py
          python ops/linefugg-reroll/fix_test.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Run LineFugg browser QA
        run: |
          npm run dev -- --host 127.0.0.1 --port 5175 > /tmp/linefugg-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5175/ >/dev/null; then break; fi
            sleep 0.5
          done
          node scripts/test-linefugg-browser.mjs
      - name: Commit validated gameplay change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/games/linefugg/LineFuggScene.ts scripts/test-linefugg-browser.mjs src/core/gameRegistry.tsx src/games/linefugg/CHANGELOG.md src/games/linefugg/GAME_STATUS.md
          git diff --cached --check
          git commit -m "feat(linefugg): reroll free cells from each played line"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
