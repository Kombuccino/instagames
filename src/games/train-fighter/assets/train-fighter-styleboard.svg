    <text x="20" y="68" font-family="monospace" font-size="15" fill="#754434">1. SILHOUETTE FIRST.  2. WEAPONS BIG.  3. WAGONS ARE LIFE.  4. SCENERY LOSES CONTRAST TO GAMEPLAY.</text>
