name: LineFugg Rebirth DA Lab

on:
  push:
    branches:
      - linefugg-rebirth-editorial-da

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-linefugg-rebirth-da-lab.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run test:repository
      - run: npm run build
      - run: git diff --check
      - name: Commit Lab integration
        run: |
          if git diff --quiet; then
            echo "No DA Lab changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/ProductionLab.tsx src/games/linefugg/GAME_STATUS.md src/games/linefugg/ART_DIRECTION.md src/games/linefugg/ASSET_MANIFEST.md
          git commit -m "art(linefugg): integrate validated Rebirth DA into Lab [rebirth-da-lab]"
          git push origin HEAD:linefugg-rebirth-editorial-da
